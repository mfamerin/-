<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17212b" />
  <title>اصلاحات دینگی</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>اصلاحات دینگی</h1>
        <p id="helloText" class="muted">مدیریت ساده اصلاحات ورود و خروج</p>
      </div>
      <button id="renameBtn" class="icon-btn hidden" type="button" aria-label="تغییر نام">✎</button>
    </header>

    <section id="nameScreen" class="card hidden">
      <h2>نام شما</h2>
      <p class="muted">این نام فقط برای خودت ذخیره می‌شود.</p>
      <input id="nameInput" class="text-input" type="text" maxlength="40" autocomplete="name" placeholder="مثلاً مرتضی" />
      <button id="saveNameBtn" class="primary-btn" type="button">ثبت نام</button>
    </section>

    <section id="mainScreen" class="hidden">
      <button id="newTaskBtn" class="primary-btn large" type="button">＋ ثبت اصلاح جدید</button>

      <div class="section-head">
        <h2>اصلاحات من</h2>
        <span id="openCount" class="badge">0</span>
      </div>

      <div id="taskList" class="task-list"></div>
      <div id="emptyState" class="empty card">
        هنوز اصلاحی ثبت نکردی.
      </div>
    </section>
  </main>

  <div id="editorOverlay" class="overlay hidden" role="dialog" aria-modal="true">
    <section class="sheet">
      <div class="sheet-head">
        <h2>ثبت اصلاح</h2>
        <button id="closeEditorBtn" class="icon-btn" type="button" aria-label="بستن">✕</button>
      </div>

      <label class="field-label">تاریخ</label>
      <button id="datePickerBtn" class="select-btn" type="button">انتخاب تاریخ</button>

      <div class="field-label">نوع اصلاح</div>
      <div class="segmented" id="typeButtons">
        <button type="button" data-type="in">ورود</button>
        <button type="button" data-type="out">خروج</button>
        <button type="button" data-type="both" class="active">ورود و خروج</button>
      </div>

      <div id="inTimeWrap" class="time-row">
        <label for="inTime">ساعت ورود</label>
        <input id="inTime" type="time" value="09:00" />
      </div>

      <div id="outTimeWrap" class="time-row">
        <label for="outTime">ساعت خروج</label>
        <input id="outTime" type="time" value="17:00" />
      </div>

      <button id="saveTaskBtn" class="primary-btn" type="button">ثبت</button>
    </section>
  </div>

  <div id="calendarOverlay" class="overlay hidden" role="dialog" aria-modal="true">
    <section class="sheet calendar-sheet">
      <div class="sheet-head">
        <h2>انتخاب تاریخ شمسی</h2>
        <button id="closeCalendarBtn" class="icon-btn" type="button" aria-label="بستن">✕</button>
      </div>

      <div class="calendar-nav">
        <button id="nextMonthBtn" class="icon-btn" type="button">‹</button>
        <strong id="calendarTitle"></strong>
        <button id="prevMonthBtn" class="icon-btn" type="button">›</button>
      </div>

      <div class="weekdays">
        <span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <button id="todayBtn" class="secondary-btn" type="button">امروز</button>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
